<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lifeline Sync - HTML Only</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body,html{margin:0;height:100%;font-family:sans-serif}
#map{height:100%}

.overlay{
position:fixed;inset:0;background:#fff;
display:flex;flex-direction:column;
justify-content:center;align-items:center;
z-index:1000;
}

button{
padding:15px;margin:10px;border:none;
border-radius:8px;font-size:16px;color:white;
}

.dashboard{
position:absolute;bottom:20px;left:50%;
transform:translateX(-50%);
background:white;padding:10px;border-radius:10px;
}

.driver-emergency{background:red;color:white}
</style>
</head>

<body>

<div class="overlay" id="start">
<h2>LIFELINE SYNC</h2>
<button style="background:red" onclick="startApp('ambulance')">AMBULANCE</button>
<button style="background:blue" onclick="startApp('driver')">DRIVER</button>
</div>

<div id="map"></div>

<div class="dashboard" id="dash">
<div id="status">Waiting...</div>
<div>Distance: <span id="dist">--</span></div>
<div>ETA: <span id="eta">--</span></div>
<div>Speed: <span id="speed">0</span></div>
</div>

<script>

let map, role, myMarker, ambMarker, routeLine;
let ambulanceData = null;

// STORAGE SYNC (works across tabs/devices sometimes)
window.addEventListener("storage", (e)=>{
    if(e.key==="ambulance"){
        ambulanceData = JSON.parse(e.newValue);
    }
});

function startApp(r){
role=r;
start.style.display="none";

map = L.map('map').setView([12.97,77.59],15);

// SAFE TILE (no 403 error)
L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png').addTo(map);

// markers
myMarker = L.circleMarker([0,0],{radius:8,color:'blue'}).addTo(map);
ambMarker = L.circleMarker([0,0],{radius:10,color:'red'}).addTo(map);
routeLine = L.polyline([],{color:'red'}).addTo(map);

startGPS();
}

// ROUTE (FREE OSRM)
async function getRoute(start,end){
const url = `https://router.project-osrm.org/route/v1/driving/${start.lng},${start.lat};${end.lng},${end.lat}?overview=full&geometries=geojson`;

const res = await fetch(url);
const data = await res.json();

if(data.routes.length){
const r = data.routes[0];

routeLine.setLatLngs(
r.geometry.coordinates.map(c=>[c[1],c[0]])
);

dist.innerText = (r.distance/1000).toFixed(2)+" km";
eta.innerText = Math.ceil(r.duration/60)+" min";
}
}

// GPS
function startGPS(){
navigator.geolocation.watchPosition(async p=>{

const lat = p.coords.latitude;
const lng = p.coords.longitude;

const myPos = L.latLng(lat,lng);

myMarker.setLatLng(myPos);
map.setView(myPos,16);

speed.innerText = Math.round((p.coords.speed||0)*3.6)+" km/h";

// 🚑 ambulance → store location
if(role==="ambulance"){
localStorage.setItem("ambulance", JSON.stringify({lat,lng}));
status.innerText="Sending Location";
}

// 🚗 driver → read location
if(role==="driver"){
const data = localStorage.getItem("ambulance");
if(data){
ambulanceData = JSON.parse(data);

const ambPos = L.latLng(ambulanceData.lat, ambulanceData.lng);
ambMarker.setLatLng(ambPos);

await getRoute(myPos, ambPos);

const d = map.distance(myPos, ambPos);

if(d < 100){
dash.classList.add("driver-emergency");
status.innerText="AMBULANCE APPROACHING!";
}else{
dash.classList.remove("driver-emergency");
status.innerText="Tracking Ambulance";
}
}
}

}, err=>{
alert("GPS Error: "+err.message);
},{
enableHighAccuracy:true,
timeout:10000,
maximumAge:0
});
}

</script>

</body>
</html>
