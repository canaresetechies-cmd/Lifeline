<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lifeline Sync - Final Polish</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        #map { height: 100%; width: 100%; position: absolute; z-index: 1; }
        
        .recenter-btn { 
            position: absolute; right: 15px; bottom: 180px; z-index: 1000; 
            background: white; border: none; border-radius: 4px; width: 45px; height: 45px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.3); cursor: pointer; display: flex; align-items: center; justify-content: center; 
        }

        .dashboard { 
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); 
            width: 90%; max-width: 420px; background: white; border-radius: 16px; 
            z-index: 1000; box-shadow: 0 8px 32px rgba(0,0,0,0.4); padding: 20px; 
            box-sizing: border-box; transition: 0.3s; text-align: center; 
        }
        
        /* Emergency Alert (Driver Only) */
        .driver-emergency { background: #d32f2f !important; color: white !important; animation: pulse 0.8s infinite; }
        @keyframes pulse { 0% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.02); } 100% { transform: translateX(-50%) scale(1); } }

        .stat-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 15px; border-top: 1px solid #eee; padding-top: 15px; }
        .val { font-size: 1.1rem; font-weight: 800; display: block; }
        .lbl { font-size: 9px; color: #777; text-transform: uppercase; font-weight: bold; }
        .driver-emergency .lbl { color: #ffcdd2; }

        .overlay { position: fixed; inset: 0; background: white; z-index: 2000; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .m-btn { padding: 18px; margin: 10px; width: 280px; border-radius: 50px; border: none; color: white; font-weight: bold; font-size: 1.1rem; cursor: pointer; }
    </style>
</head>
<body>

    <div id="startup" class="overlay">
        <h1 style="color:#1a73e8">LIFELINE SYNC</h1>
        <p style="color:#666">Crisis Response System</p>
        <button class="m-btn" style="background:#d32f2f" onclick="launch('ambulance')">AMBULANCE MODE</button>
        <button class="m-btn" style="background:#1a73e8" onclick="launch('driver')">DRIVER MODE</button>
    </div>

    <button class="recenter-btn" id="btnLoc"><img src="https://fonts.gstatic.com/s/i/googlematerialicons/my_location/v15/24px.svg" width="28"></button>
    <div id="map"></div>

    <div id="dash" class="dashboard" style="display:none">
        <div id="status" style="font-weight: 900;">GPS CONNECTED</div>
        <div class="stat-grid">
            <div><span class="lbl">Distance</span><span id="txt-dist" class="val">--</span></div>
            <div><span class="lbl">ETA</span><span id="txt-eta" class="val">--</span></div>
            <div><span class="lbl">Speed</span><span id="txt-speed" class="val">0</span></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, onDisconnect } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCDeUjN9ckmm9jqL8KFzN4QCFrs0kZ8Hic",
            authDomain: "emergencyalert-70c67.firebaseapp.com",
            databaseURL: "https://emergencyalert-70c67-default-rtdb.firebaseio.com",
            projectId: "emergencyalert-70c67",
            storageBucket: "emergencyalert-70c67.firebasestorage.app",
            messagingSenderId: "389774491851",
            appId: "1:389774491851:web:8eca46dbf667f1485a1b4e",
            measurementId: "G-TYGQWZ3RRT"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const myID = "DEV_" + Math.floor(Math.random()*900 + 100);

        // Target Hospital (Example: Bengaluru City Center)
        const hospitalPos = { lat: 12.976, lng: 77.599 };

        let map, role, myMarker, targetMarker, alertCircle, navLine;

        window.launch = (selectedRole) => {
            role = selectedRole;
            document.getElementById('startup').style.display = 'none';
            document.getElementById('dash').style.display = 'block';

            map = L.map('map', { zoomControl: false }).setView([12.9716, 77.5946], 16);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

            // Blue Marker = Device Position
            myMarker = L.circleMarker([0,0], { radius: 8, color: 'white', weight: 2, fillColor: '#1a73e8', fillOpacity: 1 }).addTo(map);
            
            // Red Marker = Target (Hospital OR Ambulance)
            targetMarker = L.circleMarker([0,0], { radius: 10, color: 'white', weight: 2, fillColor: '#d32f2f', fillOpacity: 1 }).addTo(map);
            
            // Alert Zone (50m)
            alertCircle = L.circle([0,0], { radius: 50, color: 'red', fillColor: '#f03', fillOpacity: 0.15 }).addTo(map);
            
            // Visual Navigation Line
            navLine = L.polyline([], {color: 'red', weight: 5, opacity: 0.5}).addTo(map);

            document.getElementById('btnLoc').onclick = () => map.panTo(myMarker.getLatLng());
            
            startTracking();
        };

        function startTracking() {
            navigator.geolocation.watchPosition((p) => {
                const lat = p.coords.latitude;
                const lng = p.coords.longitude;
                const myPos = L.latLng(lat, lng);
                
                myMarker.setLatLng(myPos);
                document.getElementById('txt-speed').innerText = Math.round((p.coords.speed || 0) * 3.6) + "km/h";

                // Push location to Firebase
                const path = (role === 'ambulance' ? 'ambulances/' : 'drivers/') + myID;
                set(ref(db, path), { lat, lng, ts: Date.now() });
                onDisconnect(ref(db, path)).remove();

                if (role === 'ambulance') {
                    // AMBULANCE: Target is the Hospital
                    handleAmbulanceMode(myPos);
                } else {
                    // DRIVER: Target is the Ambulance
                    handleDriverMode(myPos);
                }
            }, (err) => console.error(err), { enableHighAccuracy: true });
        }

        function handleAmbulanceMode(myPos) {
            const dist = map.distance(myPos, hospitalPos);
            document.getElementById('status').innerText = "HOSPITAL ROUTE ACTIVE";
            document.getElementById('txt-dist').innerText = Math.round(dist) + "m";
            document.getElementById('txt-eta').innerText = Math.ceil(dist / 8) + "s";
            
            targetMarker.setLatLng(hospitalPos);
            navLine.setLatLngs([myPos, hospitalPos]);
            alertCircle.setLatLng(myPos); // Radius on ambulance
        }

        function handleDriverMode(myPos) {
            onValue(ref(db, 'ambulances/'), (snap) => {
                const data = snap.val();
                if(!data) {
                    document.getElementById('status').innerText = "SCANNING FOR AMBULANCES...";
                    targetMarker.setLatLng([0,0]);
                    return;
                }

                let closestAmb = null, minD = Infinity;
                for(let id in data) {
                    if(Date.now() - data[id].ts > 15000) continue; // Check for active signal
                    const d = map.distance(myPos, [data[id].lat, data[id].lng]);
                    if(d < minD) { minD = d; closestAmb = data[id]; }
                }

                if(closestAmb) {
                    const ambPos = L.latLng(closestAmb.lat, closestAmb.lng);
                    targetMarker.setLatLng(ambPos);
                    alertCircle.setLatLng(ambPos);
                    
                    document.getElementById('txt-dist').innerText = Math.round(minD) + "m";
                    document.getElementById('txt-eta').innerText = Math.ceil(minD / 8) + "s";

                    // THE DRIVER ALERT
                    if (minD <= 50) {
                        document.getElementById('dash').classList.add('driver-emergency');
                        document.getElementById('status').innerText = "AMBULANCE APPROACHING, MAKE A WAY TO PASS IT";
                        if(!window.voiceLocked) {
                            window.voiceLocked = true;
                            speechSynthesis.speak(new SpeechSynthesisUtterance("Ambulance approaching, Make a way to pass it"));
                            setTimeout(() => window.voiceLocked = false, 15000);
                        }
                    } else {
                        document.getElementById('dash').classList.remove('driver-emergency');
                        document.getElementById('status').innerText = "AMBULANCE DETECTED";
                    }
                }
            });
        }
    </script>
</body>
</html>
